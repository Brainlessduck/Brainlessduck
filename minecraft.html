<script>

let openModpackName = null;
const modpackDescriptions = {
  'Collectionist': 'Dieses Modpack ist mein aktuelles Lieblingsmodpack. In diesem Modpack geht es darum, dass man durch die Welt geht und Items sammelt. Man hat auch ein Teleskop, mit dem man z. B. Blumen scannen kann. Im Questbook gibt es außerdem einen Teil, in dem es nur ums Fischen geht – es gibt mehrere Fisch-Mods.',
  'Society Sunlit Valley': 'Dieses Modpack ist ein sehr entspanntes und ruhiges Modpack. In diesem Modpack geht es hauptsächlich darum, Pflanzen anzubauen und zu bauen. Außerdem gibt es ein Geldsystem, mit dem man verschiedene Dinge kaufen und verkaufen kann. Insgesamt macht das Modpack sehr viel Spaß und eignet sich perfekt für alle, die ein ruhiges Spielerlebnis mögen.'
};
const modpackDescriptionsEn = {
  'Collectionist': 'This is my current favourite modpack. The idea is to walk through the world and collect items. You also get a telescope you can use to scan things like flowers. On top of that the quest book has a whole section that is only about fishing – there are several fishing mods in here.',
  'Society Sunlit Valley': 'A very relaxed and calm modpack. It is mostly about growing plants and building. There is also a money system you can use to buy and sell all kinds of things. All in all it is a lot of fun and perfect for anyone who likes a quiet playthrough.'
};
const modpackDiscords = {
  'Collectionist': 'https://discord.gg/qUdm4PK6ng',
  'Society Sunlit Valley': 'https://discord.com/invite/GdcZkrZqkj'
};
const modpackDiscordLabels = {
  'Society Sunlit Valley': 'SSV'
};
function openModpackModal(name) {
  document.getElementById('modpack-modal-title').textContent = name;
  const dict = (typeof getLang === 'function' && getLang() === 'en') ? modpackDescriptionsEn : modpackDescriptions;
  document.getElementById('modpack-modal-text').textContent = dict[name] || modpackDescriptions[name] || 'Text';
  openModpackName = name;
  const discordEl = document.getElementById('modpack-modal-discord');
  if (modpackDiscords[name]) {
    discordEl.innerHTML = (modpackDiscordLabels[name] || name) + ' Discord: <a href="' + modpackDiscords[name] + '" target="_blank">' + modpackDiscords[name] + '</a>';
    discordEl.style.display = 'block';
  } else {
    discordEl.style.display = 'none';
  }
  lastModpackTrigger = document.activeElement;
  document.getElementById('modpack-modal').classList.add('show');
  document.querySelector('#modpack-modal .modal-close').focus();
}
let lastModpackTrigger = null;
if (typeof onLangChange === 'function') {
  onLangChange(function () {
    const modal = document.getElementById('modpack-modal');
    if (openModpackName && modal && modal.classList.contains('show')) {
      const dict = getLang() === 'en' ? modpackDescriptionsEn : modpackDescriptions;
      document.getElementById('modpack-modal-text').textContent = dict[openModpackName] || modpackDescriptions[openModpackName] || 'Text';
    }
  });
}

function closeModpackModal() {
  document.getElementById('modpack-modal').classList.remove('show');
  if (lastModpackTrigger) { lastModpackTrigger.focus(); lastModpackTrigger = null; }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('modpack-modal').classList.contains('show')) {
    closeModpackModal();
  }
});

</script>
